# Regras ESTRITAS usadas só na análise estática (aplicadas numa cópia do frontend).
# Partem das regras do projeto (flutter_lints) e acrescentam verificações de
# tipagem, de Futures não aguardados e de tratamento de erros.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true       # proíbe conversões implícitas de dynamic
    strict-inference: true   # exige tipo quando não dá para inferir
    strict-raw-types: true   # proíbe genéricos sem tipo (List, Map, Future…)

linter:
  rules:
    # Confiabilidade / async
    - unawaited_futures
    - discarded_futures
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - only_throw_errors
    - avoid_catches_without_on_clauses
    - avoid_catching_errors
    - cast_nullable_to_non_nullable
    - avoid_type_to_string
    - avoid_slow_async_io
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - missing_whitespace_between_adjacent_strings
    - use_build_context_synchronously
    # Manutenibilidade / estilo
    - prefer_final_locals
    - prefer_final_fields
    - prefer_const_constructors
    - prefer_const_declarations
    - always_declare_return_types
    - avoid_redundant_argument_values
    - unnecessary_lambdas
    - avoid_positional_boolean_parameters
    - use_colored_box
    - use_decorated_box
    - sort_child_properties_last
    - avoid_print
